# Drop-in for running the agent from a config file instead of the Worker
# (systemd 248 or later). Install as
# /etc/systemd/system/ntp-agent.service.d/config.conf
# and keep the file at /etc/ntp-agent/devices.json (root, 0600).
# The agent reads the file at start: restart the service after editing it.
[Service]
EnvironmentFile=
LoadCredential=devices.json:/etc/ntp-agent/devices.json
ExecStart=
ExecStart=/usr/local/bin/ntp-agent serve -config %d/devices.json
